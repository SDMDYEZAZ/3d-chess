const tg=new THREE.Vector3(),rc=new THREE.Raycaster(),ptr=new Map();let theta=0,thetaT=0,phi=1,phiT=1,rad=14,zoomed=false,moved=0,multi=false,pd0=0;

let ac,mg,sg,nbuf,music=true,sfx=true,step=0;

function initAudio(){if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();mg=ac.createGain();mg.gain.value=music?.6:0;mg.connect(ac.destination);sg=ac.createGain();sg.gain.value=.9;sg.connect(ac.destination);
 nbuf=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;startMusic()}
 if(ac.state==='suspended')ac.resume()}
function tone(f,t,d,ty,v,dst,f2){const o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(dst||sg);o.start(t);o.stop(t+d+.05)}

const thud=(t,v,f)=>{tone(f,t,.14,'sine',v,sg,f*.5);nz(t,.05,v*.5,900)},tok=t=>{tone(360,t,.09,'triangle',.5,sg,150);nz(t,.04,.25,1800,'bandpass')};
function whinny(t){const o=ac.createOscillator(),l=ac.createOscillator(),lg=ac.createGain(),fl=ac.createBiquadFilter(),g=ac.createGain(),F=o.frequency;o.type='sawtooth';F.setValueAtTime(520,t);F.linearRampToValueAtTime(1150,t+.2);F.linearRampToValueAtTime(950,t+.38);F.exponentialRampToValueAtTime(430,t+.8);
 l.frequency.value=17;lg.gain.value=38;l.connect(lg);lg.connect(F);fl.type='bandpass';fl.frequency.value=1100;fl.Q.value=1.3;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.35,t+.06);g.gain.exponentialRampToValueAtTime(.0001,t+.85);o.connect(fl);fl.connect(g);g.connect(sg);o.start(t);l.start(t);o.stop(t+.9);l.stop(t+.9)}
function sfxMove(T,dur,nB){if(!ac||!sfx)return;const t=ac.currentTime+.02;
 if(T==='P'){tone(500,t,.05,'triangle',.15);tok(t+dur*.85)}
 else if(T==='N'){whinny(t);thud(t+dur-.02,.6,170);thud(t+dur+.12,.45,150)}
 else if(T==='B'){for(let i=0;i<nB;i++){const u=t+i*dur/nB;thud(u,.35,200+(i%2)*45);nz(u,.08,.14,1600)}}
 else if(T==='R'){nz(t,dur,.55,240);thud(t+dur,.7,90);nz(t+dur,.08,.35,2600,'bandpass')}
 else if(T==='Q'){[76,81,84,88].forEach((m,i)=>{tone(mf(m),t+i*.12,1.3,'sine',.22);tone(mf(m)*2,t+i*.12,.6,'sine',.07)})}
 else{tone(mf(36),t,2.2,'triangle',.4);tone(mf(43),t,1.8,'triangle',.22);tone(mf(55),t+dur*.8,1,'sine',.14)}}

function sfxAlert(chk,end){if(!ac||!sfx)return;const t=ac.currentTime;
 if(end&&chk)[60,64,67,72].forEach((m,i)=>tone(mf(m),t+.4+i*.15,1.2,'triangle',.25));else if(end)tone(mf(48),t+.4,1.2,'triangle',.25);else if(chk){tone(880,t+.3,.15,'square',.1);tone(660,t+.45,.2,'square',.1)}}

 if(Math.random()<.75)tone(mf(c[Math.floor(Math.random()*4)]+12*(1+Math.floor(Math.random()*2))),t,1.6,'sine',.09,mg);
 step++;setTimeout(tick,500)};tick()}
